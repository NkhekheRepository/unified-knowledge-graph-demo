<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Public Demo — Unified Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="lib/vis-network.min.js"></script>
<style>
:root{--bg:#05070d;--fg:#eef4ff;--line:rgba(120,160,220,.18);--muted:#98abc9;--card:rgba(16,24,44,.72);--gap:12px;--assist:#34d399;--risk:#fb7185;--hint:#fbbf24}
body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,rgba(56,189,248,.16),transparent),linear-gradient(180deg,#0a1020,#05070d);color:var(--fg)}
header{display:flex;gap:var(--gap);align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.btn{all:unset;padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
main{display:grid;grid-template-columns:front 360px;gap:var(--gap)}
a:link,a:visited{color:inherit}
</style>
</head>
<body>
<header><div><h1>Unified Knowledge Graph</h1><div class="sub">Public demo — sanitized sample of a governance + curation knowledge fabric</div></div><button class="btn" id="exportBtn">Export demo JSON</button></header>
<div id="network" style="height:70vh; border:1px solid var(--line); border-radius:12px"></div>
<script src="data/graph.js"></script>
<script>
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(window.GRAPH_DATA, null, 2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='unified-knowledge-graph-demo.json'; a.click(); URL.revokeObjectURL(a.href);
};
const nCount = document.createElement('div'); // not used; placeholder
const data = window.GRAPH_DATA;
const nodes = new vis.DataSet(data.nodes); const edges = new vis.DataSet(data.edges);
const network = new vis.Network(document.getElementById('network'), {nodes, edges}, {physics:{solver:'barnesHut', stabilization:{iterations:300, fit:true}}});
</script>
</body>
</html>
